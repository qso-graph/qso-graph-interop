# SPDX-License-Identifier: GPL-3.0-or-later
# Self-contained CLI, C shared/static library bundles, and Linux packages.
# Only the manual main Release may sign, using the pinned shared signing workflows.
# Build jobs receive no secrets or signing environments. Archives are assembled after signing.
name: Binaries

on:
  workflow_call:
    inputs:
      sha:
        description: 'The commit to build'
        required: true
        type: string
      sign:
        description: 'Sign, notarize and attest (a release); otherwise an unsigned trial build'
        required: true
        type: boolean
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      APPLE_TEAM_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  source:
    name: signing source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Validate with the workflow run's code, before any signing environment is entered.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Signing requires KI7MT's main Release and its exact commit
        if: inputs.sign
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          BUILD_SHA: ${{ inputs.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: python3 -I scripts/release_check.py source "$REF" "$EVENT" "$BUILD_SHA" "$WORKFLOW_SHA" "$WORKFLOW_REF" "$ACTOR" "$TRIGGERING_ACTOR"

  build:
    name: qg-interop (${{ matrix.name }})
    needs: [source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, ffi: aarch64-apple-darwin }
          - { name: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-musl, ffi: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-musl, ffi: aarch64-unknown-linux-gnu }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, ffi: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      NAME: ${{ matrix.name }}
      FFI_TARGET: ${{ matrix.ffi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The run's own commit, never a ref taken from an input (CodeQL cache poisoning):
          # inputs.sha only has to agree with it, checked in the next step.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: The commit asked for is the commit checked out
        shell: bash
        env:
          WANT: ${{ inputs.sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "$WANT" ] || { echo "::error::Asked to build ${WANT}, but this run is $(git rev-parse HEAD)."; exit 1; }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        # No cache: nothing to key it on, and no build should restore one.
        with:
          enable-cache: false
      # rust-toolchain.toml names the version; rustup installs it, and the target, here.
      - name: Rust
        shell: bash
        run: |
          set -euo pipefail
          command -v rustup || { curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH" && export PATH="$HOME/.cargo/bin:$PATH"; }
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET" "$FFI_TARGET"
      # Linux is built against musl and linked statically, so one program runs on every distribution,
      # whatever C library it has.
      - name: musl (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          # Windows: the C runtime linked in, so nothing else needs installing first.
          if [ "$RUNNER_OS" = Windows ]; then export RUSTFLAGS="-C target-feature=+crt-static"; fi
          cargo build --release --locked -p qso-graph-interop-cli --target "$TARGET"
          # musl cannot produce the default cdylib. Ubuntu 22.04 (both architectures)
          # is the oldest practical hosted GNU runner: C bundles require glibc >= 2.35.
          # MSVC supports cdylib with a static CRT as well as a static executable.
          if [ "$RUNNER_OS" = macOS ]; then
            export RUSTFLAGS="-C link-arg=-Wl,-install_name,@rpath/libqso_graph_interop_ffi.dylib"
          fi
          cargo build --release --locked -p qso-graph-interop-ffi --target "$FFI_TARGET"
      # Self-contained, said rather than assumed: what the program loads besides the OS's own.
      - name: It needs nothing installed
        shell: bash
        run: |
          set -euo pipefail
          dir="target/$TARGET/release"
          case "$RUNNER_OS" in
            Linux)
              file "$dir/qg-interop"
              file "$dir/qg-interop" | grep -q 'statically linked\|static-pie linked' || { echo "::error::qg-interop is not statically linked"; exit 1; } ;;
            macOS)
              otool -L "$dir/qg-interop"
              others=$(otool -L "$dir/qg-interop" | tail -n +2 | awk '{print $1}' | grep -vE '^/(usr/lib|System/Library)/' || true)
              [ -z "$others" ] || { echo "::error::qg-interop loads libraries macOS does not have: $others"; exit 1; } ;;
            Windows)
              # vswhere answers in Windows line endings: the \r is taken off, or the path names nothing.
              dumpbin=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -find '**/Hostx64/x64/dumpbin.exe' | tr -d '\r' | head -1)
              [ -n "$dumpbin" ] || { echo "::error::dumpbin was not found"; exit 1; }
              deps=$("$dumpbin" -nologo -dependents "$dir/qg-interop.exe" | tr -d '\r' | grep -iE '^\s+[a-z0-9_.-]+\.dll$' | tr -d ' ')
              echo "$deps"
              # Windows' own DLLs only: no Visual C++ runtime (vcruntime, msvcp, ucrtbase as a DLL to ship).
              bad=$(echo "$deps" | grep -ivE '^(kernel32|advapi32|bcrypt|bcryptprimitives|ntdll|ws2_32|userenv|user32|crypt32|secur32|ole32|oleaut32|shell32|api-ms-win-[a-z0-9-]+)\.dll$' || true)
              [ -z "$bad" ] || { echo "::error::qg-interop.exe needs DLLs Windows does not have: $bad"; exit 1; } ;;
          esac
          exe=qg-interop; [ "$RUNNER_OS" = Windows ] && exe=qg-interop.exe
          "$dir/$exe" --version

      - name: Stage unsigned files
        shell: bash
        run: uv run --no-project --python 3.11 python scripts/release_artifacts.py stage "$NAME" "$TARGET" "$FFI_TARGET" unsigned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-unsigned-${{ matrix.name }}
          path: unsigned
          if-no-files-found: error
          retention-days: 7

  sign-macos:
    needs: [source, build]
    if: inputs.sign
    permissions:
      contents: read
    uses: qso-graph/.github/.github/workflows/sign-macos.yml@ce98621da707d49c828805d92f3117b6bf282cd5 # qso-graph/.github sign-windows-secrets
    with:
      artifact: interop-unsigned-macos-arm64
      signed: interop-signed-macos-arm64
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  sign-windows:
    needs: [source, build]
    if: inputs.sign
    permissions:
      contents: read
      id-token: write
    uses: qso-graph/.github/.github/workflows/sign-windows.yml@ce98621da707d49c828805d92f3117b6bf282cd5 # qso-graph/.github sign-windows-secrets
    with:
      artifact: interop-unsigned-windows-x86_64
      signed: interop-signed-windows-x86_64
    # GitHub requires the pass; the values read are this repository's windows-signing Environment's.
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  assemble:
    needs: [source, build, sign-macos, sign-windows]
    # Unsigned CI trials skip the signing jobs. Failed or canceled signing never assembles.
    if: >-
      ${{ always() && !cancelled() && needs.source.result == 'success' && needs.build.result == 'success' &&
          ((!inputs.sign && needs.sign-macos.result == 'skipped' && needs.sign-windows.result == 'skipped') ||
           (inputs.sign && needs.sign-macos.result == 'success' && needs.sign-windows.result == 'success')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest }
          - { name: linux-x86_64, os: ubuntu-22.04 }
          - { name: linux-arm64, os: ubuntu-22.04-arm }
          - { name: windows-x86_64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The run's own commit, never a ref taken from an input (CodeQL cache poisoning):
          # inputs.sha only has to agree with it, checked in the next step.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: The commit asked for is the commit checked out
        shell: bash
        env:
          WANT: ${{ inputs.sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "$WANT" ] || { echo "::error::Asked to build ${WANT}, but this run is $(git rev-parse HEAD)."; exit 1; }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        # No cache: nothing to key it on, and no build should restore one.
        with:
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: interop-${{ inputs.sign && (runner.os == 'macOS' || runner.os == 'Windows') && 'signed' || 'unsigned' }}-${{ matrix.name }}
          path: files
      - name: Archives (signed files when requested)
        shell: bash
        run: uv run --no-project --python 3.11 python scripts/release_artifacts.py archive "$NAME" files dist
      - name: Packages (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm cpio >/dev/null
          version=$(cat files/version.txt)
          bash scripts/linux-packages.sh files/cli/qg-interop "$version" "$NAME" dist
      - name: Attest every final file
        if: inputs.sign
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-final-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
