# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy -p qso-graph-interop --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test -p qso-graph-interop --no-default-features --locked

  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned Rust
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo xtask ffi-header
      - run: cargo build -p qso-graph-interop-ffi --locked
      - run: cargo xtask ffi-c-compile
      - run: cargo xtask ffi-c-run
      - run: cargo xtask ffi-cxx
      - run: cargo xtask policy
      - run: python3 scripts/generate-fixtures.py --check
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run --no-project --with 'jsonschema[format-nongpl]==4.26.0' python scripts/gen_vectors.py --check --producer-strict
      - name: cargo vet
        run: |
          cargo install cargo-vet --version 0.10.3 --locked --quiet
          cargo vet --locked
      - name: cargo deny
        run: |
          cargo install cargo-deny --version 0.20.2 --locked --quiet
          cargo deny --locked check bans licenses sources
      - name: cargo audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --quiet
          cargo audit --file Cargo.lock

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned nightly and cargo-fuzz
        working-directory: fuzz
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo install cargo-fuzz --version 0.13.2 --locked --quiet
      - name: Format and lint the isolated fuzz workspace
        working-directory: fuzz
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
      - run: python3 fuzz/seed.py
      - name: Fuzz the decoder
        working-directory: fuzz
        env:
          SECONDS_EACH: ${{ github.event_name == 'schedule' && '600' || '60' }}
        run: cargo fuzz run wsjtx -- -max_total_time="$SECONDS_EACH" -max_len=65508 -timeout=10 -rss_limit_mb=2048 -print_final_stats=1
      - name: Fuzz N1MM decoding and command encoding
        # Each family gets the same fuzz duration as the local verifier.
        working-directory: fuzz
        env:
          SECONDS_EACH: ${{ github.event_name == 'schedule' && '600' || '60' }}
        run: cargo fuzz run n1mm -- -max_total_time="$SECONDS_EACH" -max_len=65508 -timeout=10 -rss_limit_mb=2048 -print_final_stats=1
      - name: Fuzz fldigi bodies, association and commands
        working-directory: fuzz
        env:
          SECONDS_EACH: ${{ github.event_name == 'schedule' && '600' || '60' }}
        run: cargo fuzz run fldigi -- -max_total_time="$SECONDS_EACH" -max_len=262145 -timeout=10 -rss_limit_mb=2048 -print_final_stats=1
      - name: Lockfiles did not change
        run: git diff --exit-code -- Cargo.lock fuzz/Cargo.lock
      - name: Keep failure inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  ci-all-green:
    name: ci-all-green
    needs: [check, policy, fuzz]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a job did not pass: $result"; exit 1; }
          done
