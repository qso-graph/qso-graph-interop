# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
members = ["crates/qso-graph-interop", "crates/qso-graph-interop-cli", "xtask", "crates/qso-graph-interop-ffi"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/qso-graph/qso-graph-interop"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = false
strip = "symbols"
lto = "fat"
codegen-units = 1
